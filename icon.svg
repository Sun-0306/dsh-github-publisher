<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH GitHub Publisher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <!-- git branch: two commits on a vertical trunk and one branch node -->
  <path d="M24 46V21" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M24 34c0-6.6 5.4-12 12-12h4" fill="none" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="24" cy="19.5" r="3.6" fill="#e2e8f0"/>
  <circle cx="24" cy="47.5" r="3.6" fill="#e2e8f0"/>
  <circle cx="42" cy="22" r="3.6" fill="url(#accent)"/>
  <!-- publish arrow -->
  <path d="M43 44V31" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M37.5 36.5 43 31l5.5 5.5" fill="none" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
